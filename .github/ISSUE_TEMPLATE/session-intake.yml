name: Session Full-Work Upload (SESSION-BUNDLE-v3)
description: Standardized full-provenance session + products intake for the Separate Refinery Auditor Agent
title: "[SESSION-BUNDLE-v3] YYYY-MM-DD: <short-topic>"
labels: ["session-bundle-v3", "needs-refinery-audit"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: "Agent Surface"
      options:
        - gemini_app_web
        - antigravity_ide
        - claude_code_cli
        - gemini_cli
    validations:
      required: true

  - type: textarea
    id: environment_provenance
    attributes:
      label: "1. Runtime Environment & Subagent Provenance"
      description: "Host/OS, toolchains, conversationId/thread URL, active workspace, model/tier, permission/sandbox posture, and subagents."
    validations:
      required: true

  - type: textarea
    id: skills_plugins_mcps
    attributes:
      label: "2. Skills, Plugins, MCP Tools & Hooks Used"
      description: "Exact skills read, plugins exercised, lazy/eager MCP tools called, and hooks triggered."
    validations:
      required: true

  - type: textarea
    id: accounts_oauth_credentials
    attributes:
      label: "3. Accounts, OAuth Grants & Non-Secret Credential Metadata (ZERO SECRETS)"
      description: "Per app: bound email/handle/project, auth mechanism (/u/0/, SSH, OAuth2, ADC, OIDC), public fingerprint/cmdkey target/OAuth scopes. NEVER paste tokens, passwords, private keys, or codes."
    validations:
      required: true

  - type: textarea
    id: generated_files_and_links
    attributes:
      label: "4. Generated Files, Bundled Products & Live Availability Links"
      description: "Bundled products/ path | file:/// or https:// or gs:// link | AVAILABLE_VERIFIED / BUNDLED_ONLY / REMOVED | Bytes | SHA-256"
    validations:
      required: true

  - type: textarea
    id: outcomes_and_dead_ends
    attributes:
      label: "5-6. Verified Outcomes (L1 Keep) & Pruned Dead Ends (L1 Drop)"
    validations:
      required: true

  - type: textarea
    id: errors_and_patches
    attributes:
      label: "7-9. Forensic Error/ASR Ledger (L2), Guardrail Patches (L3) & Handoff (L4)"
    validations:
      required: true
