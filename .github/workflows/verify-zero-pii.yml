name: Deterministic Zero-PII, DAG & Trajectory Refinery Verification

on:
  push:
    branches:
      - main
      - "carbon/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-zero-pii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic Zero-PII & DAG verifier
        run: python verify.py

      - name: Run Trajectory Refinery end-to-end test suite
        run: python architecture/trajectory-refinery/tests/test_refinery_pipeline.py

      - name: Full-repository Zero-PII & advisory schema gate
        run: |
          python - <<'PY'
          import json, pathlib, re, subprocess, sys

          email_re = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          win_re = re.compile(r"[A-Za-z]:[/\\]Users[/\\][A-Za-z0-9._-]+", re.IGNORECASE)
          tok_re = re.compile(r"\b(ya29\.[A-Za-z0-9_-]{12,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})\b")

          errs = []
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for rel in tracked:
              p = pathlib.Path(rel)
              if not p.is_file() or p.name == "verify-zero-pii.yml":
                  continue
              raw = p.read_text(encoding="utf-8", errors="replace")
              if email_re.search(raw):
                  errs.append(f"Email pattern detected in {rel}")
              if win_re.search(raw):
                  errs.append(f"Windows user path detected in {rel}")
              if tok_re.search(raw):
                  errs.append(f"Token pattern detected in {rel}")

          adv_dir = pathlib.Path("advisories")
          for p in sorted(adv_dir.glob("*.json")):
              obj = json.loads(p.read_text(encoding="utf-8"))
              schema = obj.get("schema") or (obj.get("payload") or {}).get("schema")
              if schema not in ("CARBON-ADVISORY-v1", "CARBON-ADVISORY-v2"):
                  errs.append(f"Unexpected schema in {p}: {schema}")

          if errs:
              print("\n".join(errs), file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(tracked)} tracked files and {len(list(adv_dir.glob('*.json')))} advisory JSON file(s) with 0 PII.")
          PY
